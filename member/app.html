<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TSF Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="members.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="dashboard-view" class="view active">
    <header class="dashboard-header">
      <img src="https://tsfclub.com/assets/TSF%C2%AE.png" alt="TSF" class="logo-small">
      <button id="signout-btn" class="btn btn-ghost btn-sm">Sign out</button>
    </header>
    
    <main class="dashboard-content">
      <h1 id="greeting">Welcome back</h1>
      
      <div class="stats-grid">
        <div class="card stat-card">
          <span class="stat-label">Program</span>
          <span class="stat-value" id="dash-program">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Payment status</span>
          <span class="stat-value" id="dash-payment">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Membership expires</span>
          <span class="stat-value" id="dash-expiry">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Current streak</span>
          <span class="stat-value" id="dash-streak">-</span>
        </div>

                  <!-- New Physical Metrics Section -->
          <div class="card profile-section">
            <h2>Physical metrics</h2>
            <dl class="detail-list">
              <div class="detail-row">
                <dt>Height</dt>
                <dd id="pv-height">-</dd>
              </div>
              <div class="detail-row">
                <dt>Weight</dt>
                <dd id="pv-weight">-</dd>
              </div>
            </dl>
          </div>
        
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
