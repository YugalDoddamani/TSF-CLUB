<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TSF Members</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="members.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- View 1: Login -->
  <div id="login-view" class="view">
    <div class="card auth-card">
      <img src="https://tsfclub.com/assets/TSF%C2%AE.png" alt="TSF" class="logo">
      <h1>Member portal</h1>
      <p class="subtitle">Sign in to access your program, payments, and events.</p>
      <button id="google-signin" class="btn btn-primary btn-block">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- View 2: Onboarding -->
  <div id="onboarding-view" class="view">
    <div class="card">
      <h1>Complete your profile</h1>
      <p class="subtitle">We need a few details before you can access your dashboard.</p>
      
            <form id="onboarding-form">
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="form-group">
          <label for="whatsapp_number">WhatsApp number</label>
          <input type="tel" id="whatsapp_number" name="whatsapp_number" placeholder="+91 XXXXX XXXXX" maxlength="14" required>
        </div>

        <div class="form-group">
          <label for="program_id">Select your program</label>
          <select id="program_id" name="program_id" required>
            <option value="">Loading programs...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="joining_date">Joining date</label>
          <input type="date" id="joining_date" name="joining_date" required>
        </div>

        <div class="form-group">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" placeholder="e.g. 175" min="50" max="250">
        </div>

        <div class="form-group">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight" placeholder="e.g. 70" min="20" max="300">
        </div>

        <div class="form-group">
          <label for="emergency_name">Emergency contact name</label>
          <input type="text" id="emergency_name" name="emergency_name" required>
        </div>

        <div class="form-group">
          <label for="emergency_phone">Emergency contact phone</label>
          <input type="tel" id="emergency_phone" name="emergency_phone" placeholder="+91 XXXXX XXXXX" maxlength="14" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Complete setup</button>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
