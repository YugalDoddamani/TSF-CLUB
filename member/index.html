<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSF Members</title>
  <link rel="stylesheet" href="members.css">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- View 1: Login -->
  <div id="login-view" class="view">
    <div class="card auth-card">
      <img src="https://tsfclub.com/assets/tsf-logo.png" alt="TSF Logo" class="logo">
      <h1>Member portal</h1>
      <p class="subtitle">Sign in to access your program, payments, and events.</p>
      <button id="google-signin" class="btn btn-primary">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- View 2: Onboarding -->
  <div id="onboarding-view" class="view">
    <div class="card">
      <h1>Complete your profile</h1>
      <p class="subtitle">We need a few details before you can access your dashboard.</p>
      
      <form id="onboarding-form">
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="form-group">
          <label for="whatsapp_number">WhatsApp number</label>
          <input type="tel" id="whatsapp_number" name="whatsapp_number" placeholder="+91" required>
        </div>

        <div class="form-group">
          <label for="program_id">Select your program</label>
          <select id="program_id" name="program_id" required>
            <option value="">Loading programs...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="emergency_name">Emergency contact name</label>
          <input type="text" id="emergency_name" name="emergency_name" required>
        </div>

        <div class="form-group">
          <label for="emergency_phone">Emergency contact phone</label>
          <input type="tel" id="emergency_phone" name="emergency_phone" required>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Complete setup</button>
      </form>
    </div>
  </div>

  <!-- View 3: Dashboard -->
  <div id="dashboard-view" class="view">
    <header class="dashboard-header">
      <img src="https://tsfclub.com/assets/tsf-logo.png" alt="TSF Logo" class="logo-small">
      <button id="signout-btn" class="btn btn-text">Sign out</button>
    </header>
    
    <main class="dashboard-content">
      <h1 id="greeting">Welcome back</h1>
      
      <div class="stats-grid">
        <div class="card stat-card">
          <span class="stat-label">Program</span>
          <span class="stat-value" id="dash-program">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Payment status</span>
          <span class="stat-value" id="dash-payment">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Membership expires</span>
          <span class="stat-value" id="dash-expiry">-</span>
        </div>
        <div class="card stat-card">
          <span class="stat-label">Current streak</span>
          <span class="stat-value" id="dash-streak">-</span>
        </div>
      </div>
    </main>
  </div>

  <script src="members.js"></script>
</body>
</html>
